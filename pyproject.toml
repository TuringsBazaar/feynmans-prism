[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "feynmans-prism"
version = "0.1.0"
description = "Paper gate + rwx policy and a HELM-style evaluator for feynman autoresearch runs"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "psycopg[binary]>=3.2.10",
    "pyyaml>=6.0.3",
]

[project.scripts]
gate = "graphs.corpus_ingest.gate:main"
helm-mirror = "tools.helm_mirror.cli:main"
rwx-policy = "graphs.corpus_ingest.policy_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["tools", "graphs"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "ruff>=0.16.5",
]
